<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producto | PatitasFelices</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="cabecera"></div>

  <main class="contenedor" id="contenido">
    <p class="vacio">Cargando...</p>
  </main>

  <div id="pie"></div>

  <script src="js/app.js"></script>
  <script>
    // El producto se identifica por ?id=N en la URL
    const id = Number(new URLSearchParams(location.search).get("id"));
    const contenido = document.getElementById("contenido");

    cargarProductos().then((productos) => {
      const p = productos.find((x) => x.id === id);

      if (!p) {
        contenido.innerHTML = '<p class="vacio">Producto no encontrado. <a href="catalogo.html"><u>Volver al catálogo</u></a></p>';
        return;
      }

      document.title = p.nombre + " | PatitasFelices";
      contenido.innerHTML = `
        <p class="migas"><a href="catalogo.html">Catálogo</a> › ${p.categoria} › ${p.mascota}</p>
        <section class="detalle">
          ${htmlFoto(p)}
          <div>
            <h1>${p.nombre}</h1>
            <p class="precio">${formatoCLP(p.precio)}</p>
            <p>${p.descripcion}</p>
            <div class="cantidad">
              <button id="menos" aria-label="Menos">−</button>
              <span id="cant">1</span>
              <button id="mas" aria-label="Más">+</button>
            </div>
            <button class="btn" id="agregar">Agregar al carrito</button>
            <p class="aviso" id="aviso"></p>
          </div>
        </section>`;

      // Selector de cantidad (mínimo 1)
      let cantidad = 1;
      const spanCant = document.getElementById("cant");
      document.getElementById("menos").onclick = () => spanCant.textContent = cantidad = Math.max(1, cantidad - 1);
      document.getElementById("mas").onclick = () => spanCant.textContent = ++cantidad;

      document.getElementById("agregar").onclick = () => {
        agregarAlCarrito(p.id, cantidad);
        document.getElementById("aviso").textContent = "¡Listo! Agregaste " + cantidad + " al carrito ✓";
      };
    });
  </script>
</body>
</html>
