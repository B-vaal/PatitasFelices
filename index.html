<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatitasFelices | Alimentos y juguetes para tu mascota</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="cabecera"></div>

  <main class="contenedor">
    <section class="hero">
      <h1>Todo para tu mejor amigo 🐕🐈</h1>
      <p>Alimentos ricos y juguetes entretenidos para perros y gatos.</p>
      <a href="catalogo.html" class="btn">Ver catálogo</a>
    </section>

    <!-- Categorías destacadas: enlazan al catálogo con el filtro ya aplicado -->
    <h2>Categorías</h2>
    <section class="categorias">
      <a class="categoria" href="catalogo.html?categoria=alimentos&mascota=perro"><span>🐶</span>Alimento perro</a>
      <a class="categoria" href="catalogo.html?categoria=alimentos&mascota=gato"><span>🐱</span>Alimento gato</a>
      <a class="categoria" href="catalogo.html?categoria=juguetes&mascota=perro"><span>🎾</span>Juguetes perro</a>
      <a class="categoria" href="catalogo.html?categoria=juguetes&mascota=gato"><span>🪶</span>Juguetes gato</a>
    </section>

    <h2>Productos populares</h2>
    <section class="grilla" id="populares"></section>
  </main>

  <div id="pie"></div>

  <script src="js/app.js"></script>
  <script>
    // Muestra solo los productos marcados como "popular" en el JSON
    cargarProductos().then((productos) => {
      const contenedor = document.getElementById("populares");
      contenedor.innerHTML = productos.filter((p) => p.popular).map(htmlTarjeta).join("");
      activarBotonesAgregar(contenedor);
    });
  </script>
</body>
</html>
